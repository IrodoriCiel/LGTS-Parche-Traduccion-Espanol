name: Generar instalador

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Generar el .exe
        run: pyinstaller app/instalador.spec --noconfirm
      # Se publica dentro de un .zip: los navegadores bloquean o avisan más con un .exe suelto.
      # El nombre lleva la versión (Instalar-Traduccion-LGTS-1.1.1.zip), que sale de app/instalador.py.
      - name: Comprimir y suma SHA-256
        shell: pwsh
        run: |
          $v = (Select-String -Path app/instalador.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "La etiqueta $env:GITHUB_REF_NAME no coincide con VERSION = $v en app/instalador.py"
          }
          $exe = "dist/Instalar-Traduccion-LGTS-$v.exe"
          if (-not (Test-Path $exe)) { throw "No encontre $exe" }
          Compress-Archive -Path $exe -DestinationPath "dist/Instalar-Traduccion-LGTS-$v.zip" -Force
          (Get-FileHash "dist/Instalar-Traduccion-LGTS-$v.zip" -Algorithm SHA256).Hash |
            Out-File -Encoding ascii "dist/Instalar-Traduccion-LGTS-$v.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: dist/Instalar-Traduccion-LGTS-*.zip*
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Parche ${{ github.ref_name }}
          body_path: .github/release.md
          files: |
            dist/Instalar-Traduccion-LGTS-*.zip
            dist/Instalar-Traduccion-LGTS-*.zip.sha256
